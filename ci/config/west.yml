# Test build for the AutoSwitch module (CI and ci/build.sh). The module itself comes from this
# repository checkout (ZMK_EXTRA_MODULES).
manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
  self:
    path: config
